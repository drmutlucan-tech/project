<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#243655" />
    <meta name="robots" content="noindex, follow" />
    <title>Sayfa bulunamadı · BOMERGRUP</title>
    <style>
      * { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
      html, body { height: 100%; margin: 0; }
      body {
        font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: #243655;
        color: #b5c1d4;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      h1 {
        font-size: clamp(2.5rem, 8vw, 4.5rem);
        font-weight: 500;
        color: #ffffff;
        letter-spacing: -0.04em;
        line-height: 1;
        margin: 0 0 20px;
      }
      p {
        font-size: 15px;
        line-height: 1.7;
        max-width: 380px;
        margin: 0 0 32px;
      }
      a {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: linear-gradient(90deg, #7fa8ff 0%, #b9d0ff 26%, #e5edff 48%, #d2e0ff 89%);
        color: #243655;
        font-size: 13px;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        text-decoration: none;
        padding: 14px 28px;
        border-radius: 6px;
        transition: opacity 0.3s ease;
      }
      a:hover { opacity: 0.9; }
      .code {
        display: inline-block;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.2em;
        color: #6b7a92;
        margin-bottom: 24px;
      }
    </style>
  </head>
  <body>
    <div>
      <div class="code">404 — Hata</div>
      <h1>Sayfa bulunamadı</h1>
      <p>Aradığınız sayfa taşınmış veya hiç var olmamış olabilir. Ana sayfaya dönerek devam edebilirsiniz.</p>
      <a href="/">Ana sayfaya dön</a>
    </div>
  </body>
</html>
